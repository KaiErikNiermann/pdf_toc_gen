[project]
name = "pdf-toc-gen"
version = "0.1.0"
description = "CLI tool to add TOC bookmarks to PDFs"
authors = [
    {name = "Kai Erik Niermann",email = "kai.niermann@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pymupdf>=1.28.2",
    "typer>=0.27.1",
    "ocrmypdf>=16.0.0",
    "pyyaml>=6.0.0",
    "doctr (>=1.9.0,<2.0.0)",
    "pdfplumber (>=0.11.9,<0.12.0)",
    "openai (>=1.0,<2.0)",
]

[project.optional-dependencies]
marker = [
    "marker-pdf>=1.10.0",
]
# PaddleOCR PP-OCRv5 classic pipeline (CPU-viable middle tier). NOTE: paddlepaddle
# must be pinned <3.2 for the fast oneDNN/mkldnn CPU path (3.2+ regressed it), and
# is best installed from the official index:
#   pip install "paddlepaddle==3.1.1" -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
# See docs/ocr-landscape-and-benchmarks.md.
paddle = [
    "paddleocr>=3.7,<4.0",
    "paddlepaddle>=3.1,<3.2",
]
deepdoc = [
    "deepdoctection>=1.0.7",
    "timm",
    "transformers",
    "python-doctr",
]
# Learned contents-line classifier. Optional so the core CLI stays light: the
# regex pass runs unchanged when scikit-learn is absent, and the learned pass
# simply does not contribute.
ml = [
    "scikit-learn>=1.5",
]

[project.scripts]
pdftoc = "pdftoc.cli:run"

[tool.poetry]
packages = [{include = "pdftoc", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.16.1"
pyright = "^1.1.411"
radon = "^6.0.1"
xenon = "^0.9.3"

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
# Defaults (pyflakes + a slice of pycodestyle) plus import sorting, pyupgrade,
# bugbear, comprehension and simplification rules.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pyright]
include = ["src/pdftoc"]
exclude = ["**/__pycache__", "scripts"]
pythonVersion = "3.12"
# Pragmatic baseline: PyMuPDF (fitz) ships overloaded stubs whose get_text()
# returns str | list | dict, which the existing code treats as str throughout.
# Those are downgraded to warnings so the pre-push type-check gate stays usable
# on the legacy code while still failing on real errors (undefined names, bad
# imports, etc.). Tighten toward strict as the codebase is annotated.
typeCheckingMode = "basic"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportIndexIssue = "warning"
reportOperatorIssue = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
